[package]
name = "mes_gateway"
version = "0.1.0"
edition = "2021"
authors = ["Sahbaaz"]

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum-test = "14.0" 
reqwest = "0.11"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"